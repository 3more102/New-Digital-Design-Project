name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NUM_CHANNELS: 4
  WIDTH: 32

jobs:
  golden-model:
    name: Python Golden Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Run pytest suite
        run: python -m pytest python -q

      - name: Run standalone golden-model smoke
        run: python python/timer_golden_model.py

  simulation:
    name: RTL Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile RTL regression
        run: |
          mkdir -p sim/results sim/logs
          iverilog -g2012 -Wall -s timer_tb \
            -DNUM_CHANNELS=${{ env.NUM_CHANNELS }} \
            -DWIDTH=${{ env.WIDTH }} \
            -I rtl \
            rtl/prescaler.sv \
            rtl/counter.sv \
            rtl/compare_unit.sv \
            rtl/pwm_generator.sv \
            rtl/input_capture.sv \
            rtl/cascade_unit.sv \
            rtl/register_block.sv \
            rtl/interrupt_controller.sv \
            rtl/timer_top.sv \
            tb/timer_tb.sv \
            -o sim/results/timer_tb.vvp

      - name: Run RTL regression
        shell: bash
        run: |
          set -o pipefail
          vvp sim/results/timer_tb.vvp 2>&1 | tee sim/logs/sim.log

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs
          path: sim/logs/

  assertions:
    name: Assertion Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile with assertion monitor
        run: |
          mkdir -p sim/results sim/logs
          iverilog -g2012 -Wall -s timer_tb \
            -DENABLE_ASSERTIONS \
            -DNUM_CHANNELS=${{ env.NUM_CHANNELS }} \
            -DWIDTH=${{ env.WIDTH }} \
            -I rtl \
            rtl/prescaler.sv \
            rtl/counter.sv \
            rtl/compare_unit.sv \
            rtl/pwm_generator.sv \
            rtl/input_capture.sv \
            rtl/cascade_unit.sv \
            rtl/register_block.sv \
            rtl/interrupt_controller.sv \
            rtl/timer_top.sv \
            tb/assertions/timer_assertions.sv \
            tb/timer_tb.sv \
            -o sim/results/timer_tb_assert.vvp

      - name: Run assertion regression
        shell: bash
        run: |
          set -o pipefail
          vvp sim/results/timer_tb_assert.vvp 2>&1 | tee sim/logs/sim_assert.log
          if grep -q "ASSERT " sim/logs/sim_assert.log; then
            echo "Assertion violation detected"
            exit 1
          fi

      - name: Upload assertion logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assertion-logs
          path: sim/logs/sim_assert.log

  lint:
    name: Verilator Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Lint synthesizable RTL
        run: |
          verilator --lint-only -Wall -Wno-fatal \
            --top-module timer_top \
            rtl/prescaler.sv \
            rtl/counter.sv \
            rtl/compare_unit.sv \
            rtl/pwm_generator.sv \
            rtl/input_capture.sv \
            rtl/cascade_unit.sv \
            rtl/register_block.sv \
            rtl/interrupt_controller.sv \
            rtl/timer_top.sv

  synthesis:
    name: Yosys Synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Run synthesis
        shell: bash
        run: |
          mkdir -p synth/output sim/logs
          cd synth
          set -o pipefail
          yosys -s synth_yosys.ys 2>&1 | tee ../sim/logs/yosys.log

      - name: Upload synthesis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-results
          path: |
            synth/output/
            sim/logs/yosys.log

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required documentation
        run: |
          for f in README.md LICENSE docs/DESIGN_SPEC.md docs/VERIFICATION_PLAN.md docs/ARCHITECTURE.md; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          test "$(wc -l < README.md)" -ge 50
